<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Todo List App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="todo-app">
            <h2>My Todo List App <img src="images/icon.png" alt="To-do Icon Image"></h2>

            <div class="row">
                <input type="text" id="input-box" placeholder="Add Task">
                <button id="addBtn" onclick="addTask()">Add</button>
            </div>

            <div id="filter-row">
                <button class="filter-btn" onclick="setFilter('all')">All</button>
                <button class="filter-btn" onclick="setFilter('completed')">Complete</button>
            </div>

            <ul id="list-container">
                <!-- <li class="checked">Task 1</li>
                <li>Task 2</li>
                <li>Task 3</li>
                <li class="checked">Task 4</li> -->
            </ul>
        </div>
    </div>


    <script src="app.js"></script>
</body>
</html>
